      :root { --ground: #0a1022; --ink: #9cc2ff; --pink: #ec8796; --orange: #f6b04a; --purple: #8f7fd6; --bone: #ede6da; }

      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 1920px; height: 1080px; font-family: "Space Mono", monospace; color: #fff; }
      #gl { position: absolute; inset: 0; width: 1920px; height: 1080px; }

      #bubble-mask { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; background: #111827;

    <script type="module">
      import * as THREE from "three";
      import * as grid from "./scenes/grid.js";
      import * as build from "./scenes/build.js";
      import * as web from "./scenes/web.js";
      import * as ball from "./scenes/ball.js";
      import * as traffic from "./scenes/traffic.js";
      import * as weather from "./scenes/weather.js";
      import * as solar from "./scenes/solar.js";
      import * as particles from "./scenes/particles.js";
      import * as gravity from "./scenes/gravity.js";
      import * as simple from "./scenes/simple.js";
      import * as network from "./scenes/network.js";

      const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("gl"), antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1); renderer.setSize(1920, 1080, false);
      renderer.localClippingEnabled = true;
      const all = [grid, build, web, ball, traffic, weather, solar, particles, gravity, simple, network];
      all.forEach((s) => s.init(THREE, renderer));

      // [scene, start, end, wipe-in kind]  kinds: L (bar moves left->right), R, U (bottom->top), cut
      const SHOTS = [
        [grid, 0, 10.6, "cut"],
        [build, 10.6, 16.0, "L"],
        [web, 16.0, 23.4, "U"],
        [ball, 23.4, 30.4, "cut"],     // browser frame zooms through (HTML)
        [traffic, 30.4, 33.35, "L"],
        [weather, 33.35, 35.15, "R"],
        [solar, 35.15, 36.75, "L"],
        [particles, 36.75, 43.4, "U"],
        [gravity, 43.4, 54.1, "cut"],  // white flash cut
        [simple, 54.1, 58.3, "R"],
        [network, 58.3, 63.0, "L"],
        [simple, 63.0, 72.75, "U"],
        [network, 72.75, 78.0, "R"],
        [build, 78.0, 85.6, "L"],
        [grid, 85.6, 93.4, "U"],
      ];
      const W = 0.5; // wipe length (s)
      const bar = new THREE.Color("#ec8796"), core = new THREE.Color("#ffffff");
      function rect(x, y, w, h, col) { renderer.setScissor(x, y, w, h); renderer.setClearColor(col, 1); renderer.clear(true, false, false); }
      const ease = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);

      function renderAt(t) {
        let i = SHOTS.findIndex((s) => t < s[2]);
        if (i < 0) i = SHOTS.length - 1;
        const cur = SHOTS[i], nxt = SHOTS[i + 1];
        renderer.setScissorTest(false);
        // wipe window straddles the boundary: [end - W/2, end + W/2]
        let from = null, to = cur, p = 1, kind = "cut";
        if (nxt && t > cur[2] - W / 2 && nxt[3] !== "cut") { from = cur; to = nxt; p = (t - (cur[2] - W / 2)) / W; kind = nxt[3]; }
        else if (i > 0 && t < cur[1] + W / 2 && cur[3] !== "cut") { from = SHOTS[i - 1]; to = cur; p = (t - (cur[1] - W / 2)) / W; kind = cur[3]; }
        if (!from) { to[0].render(t); return; }
        p = ease(Math.min(1, Math.max(0, p)));
        renderer.setScissorTest(true);
        if (kind === "U") {
          const Y = Math.round(p * 1080);
          renderer.setScissor(0, 0, 1920, Y); to[0].render(t);
          renderer.setScissor(0, Y, 1920, 1080 - Y); from[0].render(t);
          rect(0, Y - 9, 1920, 18, bar); rect(0, Y - 2, 1920, 4, core);
        } else {
          const X = Math.round((kind === "L" ? p : 1 - p) * 1920);
          const left = kind === "L" ? to : from, right = kind === "L" ? from : to;
          renderer.setScissor(0, 0, X, 1080); left[0].render(t);
          renderer.setScissor(X, 0, 1920 - X, 1080); right[0].render(t);
          rect(X - 9, 0, 18, 1080, bar); rect(X - 2, 0, 4, 1080, core);
        }
        renderer.setScissorTest(false);
      }
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      renderAt(0);

      // bubble choreography: [time, centreX, centreY, diameter]
      const B = [
        [5.0, 1600, 270, 280], [10.5, 300, 820, 260], [15.95, 1620, 260, 240], [23.35, 290, 830, 250],
        [29.0, 1520, 820, 220], [39.1, 300, 270, 260], [43.3, 1650, 820, 230], [53.9, 470, 540, 340],
        [58.2, 1600, 800, 260], [62.9, 1600, 270, 240], [72.6, 960, 540, 300], [78.5, 300, 820, 250],
        [85.5, 1340, 480, 460],
      ];
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#bubble", { x: 1420 - 150, y: 520 - 150, scale: 0 }, { x: 1420 - 150, y: 520 - 150, scale: 470 / 300, duration: 0.5, ease: "expo.out" }, 0.1);
      B.forEach(([at, cx, cy, d]) => tl.to("#bubble", { x: cx - 150, y: cy - 150, scale: d / 300, duration: 0.6, ease: "power3.inOut" }, at));
      tl.fromTo("#bubble-ring", { rotation: 0 }, { rotation: 360, duration: 93.4, ease: "none" }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
