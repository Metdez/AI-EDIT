<template>
  <style>
    #root { position: absolute; inset: 0; pointer-events: none; font-family: "Space Mono", monospace; color: #fff; }
    .hud-c { position: absolute; width: 64px; height: 64px; border-color: #9cc2ff; border-style: solid; border-width: 0; opacity: .85; }
    #hud-tl { left: 40px; top: 40px; border-left-width: 3px; border-top-width: 3px; }
    #hud-tr { right: 40px; top: 40px; border-right-width: 3px; border-top-width: 3px; }
    #hud-bl { left: 40px; bottom: 40px; border-left-width: 3px; border-bottom-width: 3px; }
    #hud-br { right: 40px; bottom: 40px; border-right-width: 3px; border-bottom-width: 3px; }
    .hud-t { position: absolute; font-size: 24px; font-weight: 700; letter-spacing: .14em; white-space: nowrap; }
    #hud-brand { left: 120px; top: 52px; }
    #hud-brand b { color: #f6b04a; }
    #hud-rec { right: 120px; top: 52px; }
    #hud-rec b { color: #ec8796; }
    #hud-tc { left: 120px; bottom: 52px; color: #9cc2ff; }
    #hud-shot { right: 120px; bottom: 52px; height: 34px; width: 640px; }
    #hud-shot span { position: absolute; right: 0; top: 0; opacity: 0; }
    #hud-shot span em { font-style: normal; color: #f6b04a; }
    #hud-bar { position: absolute; left: 560px; bottom: 64px; width: 800px; height: 4px; background: rgba(156,194,255,.18); }
    #hud-fill { position: absolute; left: 0; top: 0; width: 800px; height: 4px; background: #ec8796; transform-origin: 0 50%; }
    .hud-tick { position: absolute; top: -6px; width: 2px; height: 16px; background: rgba(156,194,255,.55); }
  </style>
  <div id="root" data-composition-id="hud" data-width="1920" data-height="1080">
    <div class="hud-c" id="hud-tl"></div><div class="hud-c" id="hud-tr"></div>
    <div class="hud-c" id="hud-bl"></div><div class="hud-c" id="hud-br"></div>
    <div class="hud-t" id="hud-brand"><b>■</b> SUNDAI // 3D SIM HACK</div>
    <div class="hud-t" id="hud-rec"><b>●</b> REC &nbsp;1080P · 30FPS</div>
    <div class="hud-t" id="hud-tc">TC 00:00:00:00</div>
    <div class="hud-t" id="hud-shot"></div>
    <div id="hud-bar"><div id="hud-fill"></div></div>
  </div>
  <script>
    (function () {
      const SHOTS = [
        [0, "HELLO"], [5.1, "SUNDAI"], [10.6, "BUILD"], [16.0, "THE THEME"], [23.4, "REAL → BROWSER"],
        [30.4, "SIM · TRAFFIC"], [33.35, "SIM · WEATHER"], [35.15, "SIM · SOLAR"], [36.75, "SIM · PARTICLES"],
        [39.2, "CREATE"], [43.4, "AI WRITES THE MATH"], [54.1, "FIRST CUBE"], [58.3, "COMMUNITY"],
        [63.0, "KEEP IT SIMPLE"], [72.75, "TALK + SHARE"], [78.0, "TAKEAWAYS"], [85.6, "THANK YOU"],
      ];
      const DUR = 93.4;
      const shot = document.getElementById("hud-shot"), bar = document.getElementById("hud-bar");
      SHOTS.forEach(([s, name], i) => {
        const el = document.createElement("span");
        el.id = "hud-s" + i;
        el.innerHTML = "<em>" + String(i + 1).padStart(2, "0") + "</em> / " + name;
        shot.appendChild(el);
        const tk = document.createElement("div"); tk.className = "hud-tick"; tk.style.left = (s / DUR) * 800 + "px"; bar.appendChild(tk);
      });
      const tc = document.getElementById("hud-tc");
      const clock = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(clock, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => {
        const f = Math.floor(clock.t * 30 + 1e-6), s = Math.floor(f / 30);
        const p2 = (n) => String(n).padStart(2, "0");
        tc.textContent = "TC 00:" + p2(Math.floor(s / 60)) + ":" + p2(s % 60) + ":" + p2(f % 30);
      } }, 0);
      tl.fromTo("#hud-fill", { scaleX: 0 }, { scaleX: 1, duration: DUR, ease: "none" }, 0);
      tl.fromTo(".hud-c", { opacity: 0, scale: 1.4 }, { opacity: 0.85, scale: 1, duration: 0.5, ease: "expo.out", stagger: 0.05 }, 0.05);
      tl.fromTo(["#hud-brand", "#hud-rec", "#hud-tc", "#hud-bar"], { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out", stagger: 0.06 }, 0.2);
      SHOTS.forEach(([s], i) => {
        const end = i + 1 < SHOTS.length ? SHOTS[i + 1][0] : DUR + 1;
        tl.fromTo("#hud-s" + i, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out", immediateRender: false }, Math.max(0.2, s));
        if (end < DUR) tl.set("#hud-s" + i, { opacity: 0 }, end);
      });
      window.__timelines["hud"] = tl;
    })();
  </script>
</template>
