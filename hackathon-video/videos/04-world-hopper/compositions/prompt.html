<template>
  <style>
    #root { position: absolute; inset: 0; pointer-events: none; }
    #pr-bar { position: absolute; left: 470px; top: 112px; width: 980px; height: 88px; border-radius: 44px; opacity: 0;
      background: rgba(14,16,30,.84); border: 1.5px solid rgba(255,255,255,.2); box-shadow: 0 18px 50px rgba(0,0,0,.5);
      display: flex; align-items: center; padding: 0 22px 0 36px; font: 400 34px "Space Mono", monospace; color: #fff; }
    #pr-bar .lead { color: #8f7fd6; margin-right: 18px; font-weight: 700; }
    #pr-bar .txt { flex: 1; position: relative; height: 50px; white-space: nowrap; }
    #pr-bar .line { position: absolute; left: 0; top: 0; line-height: 50px; opacity: 0; }
    #pr-bar .line span { display: none; }
    .pr-caret { display: inline-block; width: 3px; height: 40px; background: #ec8796; vertical-align: middle; margin-left: 4px; }
    #pr-key { width: 64px; height: 56px; border-radius: 28px; background: #2a2d44; color: #f6b04a; display: flex; align-items: center; justify-content: center; font-size: 30px; }
    #pr-label { position: absolute; left: 470px; top: 66px; font: 700 28px "Space Mono", monospace; letter-spacing: .14em; color: #c9c3f2; opacity: 0; }
  </style>
  <div id="root" data-composition-id="prompt" data-width="1920" data-height="1080">
    <div id="pr-label">GENERATE A WORLD</div>
    <div id="pr-bar"><span class="lead">&gt;</span><div class="txt" id="pr-txt"></div><div id="pr-key">&#8629;</div></div>
  </div>
  <script>
    (function () {
      // [show, typeStart, typeEnd, enter, hide, text]
      const P = [
        [16.25, 16.45, 17.5, 17.72, 18.45, "a rainy old-town lane"],
        [30.5, 30.65, 31.7, 31.95, null, "boston traffic at night"],
        [null, 33.35, 33.78, 33.9, null, "a crazy storm"],
        [null, 34.7, 35.12, 35.22, null, "a solar system"],
        [null, 35.95, 36.38, 36.47, 37.25, "1,000 particles"],
        [53.25, 53.35, 53.8, 53.93, 55.0, "a spinning cube"],
        [70.7, 70.8, 71.35, 71.48, 72.6, "make it interactive"],
      ];
      const txt = document.getElementById("pr-txt");
      const tl = gsap.timeline({ paused: true });
      let prevLine = null;
      P.forEach(([show, ts, te, enter, hide, text], i) => {
        const line = document.createElement("div"); line.className = "line"; line.id = "pr-line-" + i;
        line.innerHTML = [...text].map((c) => `<span>${c === " " ? "&nbsp;" : c}</span>`).join("") + '<i class="pr-caret"></i>';
        txt.appendChild(line);
        // inside the browser window (30.5-32.9) the bar sits lower, clear of the browser chrome, then rides back up
        const dy = i === 1 ? 112 : 0;
        if (show != null) tl.fromTo(["#pr-bar", "#pr-label"], { opacity: 0, y: dy - 24 }, { opacity: 1, y: dy, duration: 0.4, ease: "expo.out" }, show);
        if (i === 1) tl.to(["#pr-bar", "#pr-label"], { y: 0, duration: 0.75, ease: "power3.in" }, 32.15);
        if (prevLine) tl.set(prevLine, { opacity: 0 }, ts);
        tl.set(line, { opacity: 1 }, ts);
        const chars = line.querySelectorAll("span"), step = (te - ts) / chars.length;
        chars.forEach((c, k) => tl.set(c, { display: "inline" }, ts + k * step));
        tl.fromTo("#pr-key", { scale: 1, backgroundColor: "#2a2d44", color: "#f6b04a" }, { scale: 0.86, backgroundColor: "#f6b04a", color: "#111827", duration: 0.08, ease: "power2.out", immediateRender: false }, enter);
        tl.to("#pr-key", { scale: 1, backgroundColor: "#2a2d44", color: "#f6b04a", duration: 0.3, ease: "power2.inOut" }, enter + 0.1);
        if (hide != null) { tl.to(["#pr-bar", "#pr-label"], { opacity: 0, y: -16, duration: 0.25, ease: "power2.in" }, hide); tl.set(line, { opacity: 0 }, hide + 0.26); prevLine = null; }
        else prevLine = line;
      });
      window.__timelines = window.__timelines || {};
      window.__timelines["prompt"] = tl;
    })();
  </script>
</template>
