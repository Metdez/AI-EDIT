    <style>
      :root { --ground: #111827; --ink: #ffffff; --pink: #ec8796; --orange: #f6b04a; --purple: #8f7fd6; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); font-family: "Space Mono", monospace; color: var(--ink); }
      /* WebGL draws at 960x540 and is upscaled x2 with hard pixels */
      #gl { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; image-rendering: pixelated; z-index: 0; }
      /* scanline + vignette for the boot-screen feel */
      #crt { position: absolute; inset: 0; z-index: 30; pointer-events: none;
        background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 3px, rgba(0,0,0,.10) 3px 4px),
                    radial-gradient(ellipse at center, rgba(0,0,0,0) 60%, rgba(5,8,20,.55) 100%); }
      /* bubble: wrapper moved by GSAP x/y/scale only. Pixel-stepped circle via clip-path. */
      #bubble { position: absolute; left: 0; top: 0; width: 280px; height: 280px; z-index: 20; }
      .px { position: absolute; clip-path: polygon(68.75% 0%, 68.75% 6.25%, 81.25% 6.25%, 81.25% 12.5%, 87.5% 12.5%, 87.5% 18.75%, 93.75% 18.75%, 93.75% 31.25%, 100% 31.25%, 100% 68.75%, 93.75% 68.75%, 93.75% 81.25%, 87.5% 81.25%, 87.5% 87.5%, 81.25% 87.5%, 81.25% 93.75%, 68.75% 93.75%, 68.75% 100%, 31.25% 100%, 31.25% 93.75%, 18.75% 93.75%, 18.75% 87.5%, 12.5% 87.5%, 12.5% 81.25%, 6.25% 81.25%, 6.25% 68.75%, 0% 68.75%, 0% 31.25%, 6.25% 31.25%, 6.25% 18.75%, 12.5% 18.75%, 12.5% 12.5%, 18.75% 12.5%, 18.75% 6.25%, 31.25% 6.25%, 31.25% 0%); }
      #b-shadow { inset: 0; transform: translate(12px, 12px); background: #05070f; opacity: .7; }
      #b-ring { inset: 0; background: linear-gradient(135deg, var(--pink), var(--orange)); }
      #b-face { inset: 14px; background: #1b2238; overflow: hidden; }
      #avatar { width: 100%; height: 100%; object-fit: cover; display: block; }
    </style>
  </head>

      <canvas id="gl" width="960" height="540" data-layout-ignore></canvas>

        <div id="b-face" class="px">
          <video id="avatar" class="clip" src="assets/avatar_square.mp4" muted playsinline data-start="0" data-duration="93.4" data-track-index="2"></video>

      </div>

      <audio id="music" class="clip" src="assets/music/chip-bed.wav" data-start="0" data-duration="93.4" data-volume="0.11" data-track-index="7"></audio>
      <audio id="sfx-00" class="clip" src="assets/sfx/glitch-3.mp3" data-start="0.05" data-duration="3.1" data-volume="0.22" data-track-index="5"></audio>
      <audio id="sfx-01" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="3.3" data-duration="0.57" data-volume="0.3" data-track-index="5"></audio>

      <audio id="sfx-12" class="clip" src="assets/sfx/typing.mp3" data-start="43.6" data-duration="1.54" data-volume="0.2" data-track-index="5"></audio>

    </div>
    <script type="module">
      import * as THREE from "three";
      import { init, render } from "./scenes/engine.js";
      const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("gl"), antialias: false, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1); renderer.setSize(960, 540, false);
      init(THREE, renderer);
      window.addEventListener("hf-seek", (e) => render(e.detail.time));
      render(0);

      // Bubble: centre (cx, cy) at scale s -> wrapper x/y. Hops are 8-bit: stepped eases.
      const P = { BIG: [460, 540, 1.75], TL: [240, 240, 0.93], TR: [1680, 240, 0.93], BL: [240, 840, 0.93], BR: [1680, 840, 0.93] };
      const at = (k) => ({ x: P[k][0] - 140, y: P[k][1] - 140, scale: P[k][2] });
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#bubble", { ...at("BIG"), scale: 0.2 }, { ...at("BIG"), duration: 0.3, ease: "steps(5)" }, 0);
      [[5.1, "TL"], [10.8, "BR"], [16.0, "TR"], [30.8, "BR"], [39.2, "TR"], [52.2, "BL"], [63.0, "TR"], [73.0, "BL"], [79.0, "TR"], [85.6, "BIG"]]
        .forEach(([t, k]) => tl.to("#bubble", { ...at(k), duration: 0.42, ease: "steps(6)" }, t));
      // reactions on the big words: a two-step pixel punch on the ring
      [7.24, 18.1, 22.26, 36.9, 43.64, 88.6].forEach((t) =>
        tl.to("#b-ring", { scale: 1.08, duration: 0.1, ease: "steps(2)", yoyo: true, repeat: 1 }, t));
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
