  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      document.querySelectorAll('[data-composition-id="captions"] .cap').forEach((el) => {
        const tin = +el.dataset.in, tout = +el.dataset.out, e = el.dataset.e, t = el.querySelector(".t"), card = el.querySelector(".card");
        tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.01 }, tin);
        if (e === "type") { // pixel type-on: letters switch on one by one (split once at load)
          const letters = [];
          const walk = document.createTreeWalker(t, NodeFilter.SHOW_TEXT), nodes = [];
          while (walk.nextNode()) nodes.push(walk.currentNode); // document order, so bold words type in place
          nodes.forEach((cn) => { const frag = document.createDocumentFragment();
            [...cn.textContent].forEach((ch) => { const sp = document.createElement("span"); sp.textContent = ch; frag.appendChild(sp); letters.push(sp); });
            cn.replaceWith(frag); });
          const step = Math.min(0.03, 0.42 / letters.length);
          letters.forEach((sp, k) => tl.fromTo(sp, { opacity: 0 }, { opacity: 1, duration: 0.01 }, tin + k * step));
        } else if (e === "blur") {
          tl.fromTo(card, { filter: "blur(10px)", y: 14 }, { filter: "blur(0px)", y: 0, duration: 0.18, ease: "power3.out" }, tin);
          tl.set(card, { filter: "none" }, tin + 0.2);
        } else { // 8-bit step up
          tl.fromTo(card, { y: 48 }, { y: 0, duration: 0.2, ease: "steps(4)" }, tin);
        }
        if (tout < 93.39) {
          tl.to(card, { y: -16, duration: 0.12, ease: "steps(2)" }, tout - 0.12);
          tl.to(el, { opacity: 0, duration: 0.12, ease: "power2.in" }, tout - 0.12);
          tl.set(el, { opacity: 0, visibility: "hidden" }, tout);
        }
      });
      window.__timelines = window.__timelines || {};
      window.__timelines["captions"] = tl;
