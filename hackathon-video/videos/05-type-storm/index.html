<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script type="importmap">
      { "imports": { "three": "./lib/three/three.module.min.js", "three/addons/": "./lib/three/addons/" } }
    </script>
    <style>
      :root { --ground: #050505; --ink: #ffffff; --pink: #ec8796; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 1920px; height: 1080px; font-family: "Archivo Black", sans-serif; color: var(--ink); background: var(--ground); }
      #gl { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      /* bubble wrapper: positioned by GSAP x/y/scale only */
      #bubble { position: absolute; left: 0; top: 0; width: 300px; height: 300px; z-index: 20; }
      #bubble-clip { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; border: 6px solid var(--ink);
        box-shadow: 0 10px 40px rgba(0,0,0,.6); background: #111; }
      #bubble-ring { position: absolute; inset: -16px; border-radius: 50%; border: 26px solid var(--ink); opacity: 0; }
      #avatar { width: 100%; height: 100%; object-fit: cover; }
      /* prime the two canvas fonts so the compiler bundles them */
      #fontprime { position: absolute; left: 0; top: 0; opacity: 0; font-size: 10px; pointer-events: none; }
      #fontprime .m { font-family: "JetBrains Mono", monospace; font-weight: 700; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="93.4" data-width="1920" data-height="1080">
      <canvas id="gl" width="1920" height="1080" data-layout-ignore></canvas>
      <div id="fontprime" data-layout-ignore>Aa <span class="m">Aa</span></div>

      <div id="logo-in" data-composition-id="logo-in" data-composition-src="compositions/logo-in.html" data-start="7.05" data-duration="1.4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="counter" data-composition-id="counter" data-composition-src="compositions/counter.html" data-start="36.75" data-duration="2.3" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="cursor" data-composition-id="cursor" data-composition-src="compositions/cursor.html" data-start="71.1" data-duration="1.2" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="outro" data-composition-id="outro" data-composition-src="compositions/outro.html" data-start="88.45" data-duration="4.95" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="93.4" data-track-index="2" data-track-kind="captions" data-width="1920" data-height="1080"></div>
      <div id="sfx" data-composition-id="sfx" data-composition-src="compositions/sfx.html" data-start="0" data-duration="93.4" data-track-index="5" data-width="1920" data-height="1080"></div>

      <div id="bubble" data-layout-allow-occlusion>
        <div id="bubble-ring"></div>
        <div id="bubble-clip">
          <video id="avatar" class="clip" src="assets/avatar_square.mp4" muted playsinline data-start="0" data-duration="93.4" data-track-index="3"></video>
        </div>
      </div>
      <audio id="voice" class="clip" src="assets/voice.m4a" data-start="0" data-duration="93.4" data-volume="1" data-track-index="4"></audio>
    </div>
    <script type="module">
      import * as THREE from "three";
      import * as storm from "./scenes/storm.js";

      const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("gl"), antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1); renderer.setSize(1920, 1080, false);
      let built = false;
      window.addEventListener("hf-seek", (e) => { if (built) storm.render(e.detail.time); });

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["storm"] = (async () => {
        await Promise.all([document.fonts.load('100px "Archivo Black"'), document.fonts.load('700 54px "JetBrains Mono"')]);
        if (!document.fonts.check('100px "Archivo Black"')) console.warn("[storm] Archivo Black not loaded; canvas type falls back");
        await storm.init(THREE, renderer);
        built = true;

        // bubble: snaps to a new spot on every sentence; three times it is the letter O
        const B = (c) => ({ x: c[0] - 150, y: c[1] - 150, scale: c[2] / 300 });
        const O = (s) => [s.x, s.y, s.d];
        const TR = [1660, 210, 230], TL = [260, 210, 230], BR = [1660, 870, 230], BL = [260, 870, 230];
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#bubble", { ...B(O(storm.slots.yo)), scale: 0 }, { ...B(O(storm.slots.yo)), duration: 0.45, ease: "expo.out" }, 0.05);
        const moves = [
          [0.7, [1490, 540, 460]], [4.22, TR], [9.1, BL], [16.02, TR], [22.98, BR], [24.66, TL], [30.56, TR], [39.22, BL],
          [42.05, O(storm.slots.cool), 0.4], [43.28, TR], [48.68, BR], [52.24, TL], [55.34, TR], [56.64, BL], [63.1, TR], [66.68, BL],
          [69.76, TR], [72.3, O(storm.slots.goes), 0.4], [73.48, TL], [78.88, BR], [85.55, [1460, 540, 480], 0.5],
        ];
        for (const [t, c, d = 0.35] of moves) tl.to("#bubble", { ...B(c), duration: d, ease: "power4.inOut" }, t);
        // letter ring on while the bubble is an O
        for (const [a, b] of [[0.25, 0.7], [42.3, 43.28], [72.55, 73.48]]) {
          tl.fromTo("#bubble-ring", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, a);
          tl.to("#bubble-ring", { opacity: 0, duration: 0.15, ease: "power2.in" }, b);
        }
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
