<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script type="importmap">
      { "imports": { "three": "./lib/three/three.module.min.js", "three/addons/": "./lib/three/addons/" } }
    </script>
    <style>
      :root { --ground: #0b0d1a; --ink: #ffffff; --pink: #ec8796; --orange: #f6b04a; --purple: #8f7fd6; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 1920px; height: 1080px; font-family: "Space Mono", monospace; color: var(--ink); }
      #gl { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      /* bubble: wrapper is positioned by GSAP x/y/scale only (never left/top) */
      #bubble { position: absolute; left: 0; top: 0; width: 300px; height: 300px; border-radius: 50%; overflow: hidden;
        border: 6px solid var(--ink); box-shadow: 0 12px 40px rgba(0,0,0,.5); z-index: 10; }
      #avatar { width: 100%; height: 100%; object-fit: cover; }
      #title { position: absolute; left: 96px; top: 96px; font-size: 96px; font-weight: 700; z-index: 5; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      <canvas id="gl" width="1920" height="1080" data-layout-ignore></canvas>
      <div id="title" class="clip" data-start="0" data-duration="12" data-track-index="1"><span id="title-in">SPIKE TEST</span></div>
      <div id="bubble" data-layout-allow-occlusion>
        <video id="avatar" class="clip" src="assets/avatar_square.mp4" muted playsinline data-start="0" data-duration="12" data-track-index="2"></video>
      </div>
      <audio id="voice" class="clip" src="assets/voice.m4a" data-start="0" data-duration="12" data-volume="1" data-track-index="3"></audio>
    </div>
    <script type="module">
      import * as THREE from "three";
      // seeded PRNG: never Math.random()
      const rng = (a) => () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
      const rand = rng(7);
      const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("gl"), antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1); renderer.setSize(1920, 1080, false);
      const scene = new THREE.Scene(); scene.background = new THREE.Color("#0b0d1a");
      const cam = new THREE.PerspectiveCamera(50, 16 / 9, 0.1, 200);
      const N = 4000, pos = new Float32Array(N * 3), seed = new Float32Array(N);
      for (let i = 0; i < N; i++) { pos[i*3] = (rand()-.5)*30; pos[i*3+1] = (rand()-.5)*16; pos[i*3+2] = (rand()-.5)*30; seed[i] = rand(); }
      const geo = new THREE.BufferGeometry(); geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
      const pts = new THREE.Points(geo, new THREE.PointsMaterial({ color: "#ec8796", size: 0.12 }));
      const knot = new THREE.Mesh(new THREE.TorusKnotGeometry(2, 0.6, 160, 24), new THREE.MeshNormalMaterial());
      scene.add(pts, knot);
      function renderAt(t) { // pure function of t: frames render out of order
        knot.rotation.set(t * 0.6, t * 0.9, 0); pts.rotation.y = t * 0.15;
        cam.position.set(Math.sin(t * 0.3) * 10, 2, Math.cos(t * 0.3) * 10); cam.lookAt(0, 0, 0);
        renderer.render(scene, cam);
      }
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      renderAt(0);

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#title-in", { yPercent: 100, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.3);
      // bubble corners: BR -> BL -> TR
      tl.fromTo("#bubble", { x: 1560, y: 720, scale: 0 }, { x: 1560, y: 720, scale: 1, duration: 0.4, ease: "back.out(1.6)" }, 0.2);
      tl.to("#bubble", { x: 60, y: 720, duration: 0.6, ease: "power3.inOut" }, 4);
      tl.to("#bubble", { x: 1560, y: 60, scale: 1.3, duration: 0.6, ease: "power3.inOut" }, 8);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
